name: Unified Daily TV Schedule Sync

on:
  schedule:
    # Runs at 23:30 UTC (which is 12:30 AM CET - Italy Time)
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz pillow

      - name: Run EPG Scraper Script
        run: python epg_ripper.py 

      - name: Run Logo Update Script
        run: python update_logos.py

      - name: Configure AWS CLI for high-concurrency
        run: |
          aws configure set default.s3.max_concurrent_requests 50
          aws configure set default.s3.max_queue_size 10000

      - name: Sync Schedule & Images to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Sync Schedules
          aws s3 sync ./schedule s3://italian-site/schedule/ \
            --endpoint-url https://c222653e18e0baf276756cd9bcdfe36c.eu.r2.cloudflarestorage.com \
            --delete
            
          # Sync Images
          aws s3 sync ./downloaded-images s3://italian-site/wp-content/uploads/downloaded-images/ \
            --endpoint-url https://c222653e18e0baf276756cd9bcdfe36c.eu.r2.cloudflarestorage.com \
            --delete

      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'

      - name: Trigger Vercel Deployment
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_EPoWdDhAn2rVDsAWiv1p2bJUf3tM/lHbQa795lz"
