name: Unified Daily TV Schedule Sync

on:
  schedule:
    # Runs at 23:30 UTC (which is 12:30 AM CET - Italy Time)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Granted globally so Jobs 1 and 2 can push code back

jobs:
  # ==========================================
  # 1st WORKFLOW: Update TV Schedule
  # ==========================================
  scrape-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run EPG Scraper Script
        run: python epg_ripper.py 

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add schedule/ scrape.log
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TV schedules and scrape log" && git push)

  # ==========================================
  # 2nd WORKFLOW: Download Logos & Update JSONs
  # ==========================================
  update-logos:
    needs: scrape-epg # Forces this job to wait until 'scrape-epg' is done
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Crucial: Check out the branch tip so we get the commits pushed by Job 1
          ref: ${{ github.ref_name }} 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run update script
        run: python update_logos.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add schedule/ downloaded-images/
          
          git commit -m "Auto-update: Downloaded logos and updated JSONs [skip ci]" || echo "No changes to commit"
          
          git push

  # ==========================================
  # 3rd WORKFLOW: Sync to Cloudflare R2 and Purge Cache
  # ==========================================
  deploy-to-r2:
    needs: update-logos # Forces this job to wait until 'update-logos' is done
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Crucial: Check out the branch tip so we get the commits pushed by Job 2
          ref: ${{ github.ref_name }}

      - name: Configure AWS CLI for high-concurrency
        run: |
          aws configure set default.s3.max_concurrent_requests 50
          aws configure set default.s3.max_queue_size 10000

      - name: Sync Schedule Folder to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync ./schedule s3://italian-site/schedule/ \
            --endpoint-url https://c222653e18e0baf276756cd9bcdfe36c.eu.r2.cloudflarestorage.com \
            --delete

      - name: Sync Downloaded Images to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync ./downloaded-images s3://italian-site/wp-content/uploads/downloaded-images/ \
            --endpoint-url https://c222653e18e0baf276756cd9bcdfe36c.eu.r2.cloudflarestorage.com \
            --delete

      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
