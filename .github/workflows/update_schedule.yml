name: Update TV Schedule

on:
  schedule:
    # Runs automatically at 00:00 UTC every day. You can change this cron timing.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run the script manually from the Actions tab

jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push code back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Feel free to change to your preferred version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run EPG Scraper Script
        run: python epg_ripper.py # IMPORTANT: Change this to the actual name of your python file

      - name: Commit and Push changes
        run: |
          # Configure Git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add the schedule directory AND the log file
          git add schedule/ scrape.log
          
          # Check if there are any changes to commit, then commit and push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TV schedules and scrape log" && git push)
